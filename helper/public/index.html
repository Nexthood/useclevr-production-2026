<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UseClevr Hybrid AI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b12;
        color: #edf3ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(145deg, #080b12 0%, #101827 55%, #111827 100%);
      }
      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }
      section {
        width: min(720px, 100%);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.84);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        overflow: hidden;
      }
      header,
      form {
        padding: 20px;
      }
      header {
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      p {
        margin: 8px 0 0;
        color: #aebbd0;
        font-size: 14px;
      }
      #messages {
        display: grid;
        gap: 12px;
        min-height: 240px;
        max-height: 420px;
        overflow: auto;
        padding: 20px;
      }
      .message {
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        padding: 12px;
        background: rgba(30, 41, 59, 0.72);
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .message.user {
        margin-left: auto;
        max-width: 80%;
        background: rgba(14, 165, 233, 0.18);
      }
      form {
        display: flex;
        gap: 10px;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
      }
      input {
        min-width: 0;
        flex: 1;
        border: 1px solid rgba(148, 163, 184, 0.32);
        border-radius: 9px;
        background: rgba(15, 23, 42, 0.92);
        color: #edf3ff;
        padding: 12px;
      }
      button {
        border: 0;
        border-radius: 9px;
        background: #22d3ee;
        color: #082f49;
        font-weight: 700;
        padding: 0 16px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.12);
        color: #bbf7d0;
        padding: 6px 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <header>
          <h1>UseClevr Hybrid AI</h1>
          <p>Private analysis on your device. Files stay on your device when Hybrid AI is active.</p>
          <span class="status" id="status">Checking secure runtime...</span>
        </header>
        <div id="messages">
          <div class="message">UseClevr Helper is ready for private business questions.</div>
        </div>
        <form id="form">
          <input id="input" placeholder="Ask about your data privately..." autocomplete="off" />
          <button type="submit">Ask privately</button>
        </form>
      </section>
    </main>
    <script>
      const statusEl = document.getElementById("status")
      const messages = document.getElementById("messages")
      const form = document.getElementById("form")
      const input = document.getElementById("input")

      async function updateStatus() {
        try {
          const response = await fetch("/status")
          const status = await response.json()
          statusEl.textContent = status.privateEngineReady
            ? "Secure runtime connected"
            : "Private AI engine needs setup"
          statusEl.style.background = status.privateEngineReady ? "rgba(34, 197, 94, 0.12)" : "rgba(234, 179, 8, 0.14)"
          statusEl.style.color = status.privateEngineReady ? "#bbf7d0" : "#fde68a"
        } catch {
          statusEl.textContent = "UseClevr Helper is not running"
          statusEl.style.background = "rgba(239, 68, 68, 0.14)"
          statusEl.style.color = "#fecaca"
        }
      }

      function addMessage(text, user) {
        const node = document.createElement("div")
        node.className = user ? "message user" : "message"
        node.textContent = text
        messages.appendChild(node)
        messages.scrollTop = messages.scrollHeight
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault()
        const message = input.value.trim()
        if (!message) return
        input.value = ""
        addMessage(message, true)
        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, mode: "private-analysis" }),
          })
          const body = await response.json()
          addMessage(body.answer || "Private analysis could not answer yet.")
        } catch {
          addMessage("UseClevr Helper is not running. Start the helper or download it again.")
        }
      })

      updateStatus()
      setInterval(updateStatus, 5000)
    </script>
  </body>
</html>
