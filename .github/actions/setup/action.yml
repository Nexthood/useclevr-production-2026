name: Setup Node and pnpm
description: Setup Node, activate Corepack pnpm, install dependencies

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "26.x"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Activate pnpm through Corepack
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@11.5.0 --activate

    - name: Add pnpm to PATH
      shell: bash
      run: |
        PNPM_HOME="$(corepack env)"
        echo "Corepack pnpm location: $PNPM_HOME"
        echo "$PNPM_HOME" >> "$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile