name: Shared Validation

on:
  workflow_call:
    inputs:
      run_command:
        description: Command to run after install
        required: true
        type: string
      needs_postgres:
        description: Start a PostgreSQL service container
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Activate pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0+sha512.dbfcc4f81cf48597afd4bc391ffdf12c11f1a9fb83a395bfa6b0a2d9cc2fd8ffebafdb1ccbd529632153f793904c2615b7f09fe1a345473fd1c35845172a8eb1 --activate

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.x"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: ${{ inputs.run_command }}
        env:
          AUTH_SECRET: ${{ format('{0}:{1}', github.sha, github.run_id) }}
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
