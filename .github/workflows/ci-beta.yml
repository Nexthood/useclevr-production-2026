name: Validate Beta

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-and-build:
    name: Validate source and production build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          cache: pnpm

      - name: Activate pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:types
      - run: pnpm validate:dist
      - run: pnpm lint:package
      - run: pnpm test:all
      - run: pnpm build

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          cache: pnpm

      - name: Activate pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
