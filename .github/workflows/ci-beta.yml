name: Validate Beta

on:
  push:
    branches: [beta]

jobs:
  validate-source-and-build:
    name: Validate source and production build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          package-manager: pnpm@11.5.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:types
      - run: pnpm validate:dist
      - run: pnpm lint:package
      - run: pnpm test:all
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          package-manager: pnpm@11.5.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
