name: Validate Source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-source-and-build:
    name: Validate source and production build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26.x"

- name: Activate pnpm through Corepack
         run: |
           corepack enable
           corepack prepare pnpm@11.5.0+sha512.dbfcc4f81cf48597afd4bc391ffdf12c11f1a9fb83a395bfa6b0a2d9cc2fd8ffebafdb1ccbd529632153f793904c2615b7f09fe1a345473fd1c35845172a8eb1 --activate

       - run: pnpm install --frozen-lockfile
       - run: pnpm validate:types
       - run: pnpm validate:dist
       - run: pnpm lint:package
       - run: pnpm test:all
       - run: pnpm build
         env:
           DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

   docs:
     runs-on: ubuntu-latest

     steps:
       - uses: actions/checkout@v6

       - uses: actions/setup-node@v6
         with:
           node-version: "26.x"

       - name: Activate pnpm through Corepack
         run: |
           corepack enable
           corepack prepare pnpm@11.5.0+sha512.dbfcc4f81cf48597afd4bc391ffdf12c11f1a9fb83a395bfa6b0a2d9cc2fd8ffebafdb1ccbd529632153f793904c2615b7f09fe1a345473fd1c35845172a8eb1 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
