name: Validate Source

on:
  push:
    branches: [main, beta]

jobs:
  validate-source-and-build:
    name: Validate source and production build
    if: >
      !(github.ref == 'refs/heads/beta' &&
        contains(github.event.head_commit.message || '', '[skip ci]'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile --loglevel warn
      - run: pnpm validate:types
      - run: pnpm validate:dist --loglevel warn
      - run: pnpm lint --loglevel warn
      - run: pnpm test:all --loglevel warn
      - run: pnpm build --loglevel warn
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docs:
    name: Documentation checks
    if: >
      !(github.ref == 'refs/heads/beta' &&
        contains(github.event.head_commit.message || '', '[skip ci]'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile --loglevel warn
      - run: pnpm docs:check --loglevel warn
