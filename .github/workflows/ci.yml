name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'dist/**'

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:types
      - run: pnpm validate:dist
      - run: pnpm lint
      - run: pnpm test:all

  full:
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
