name: Validate Source

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

jobs:
  validate-source-and-build:
    name: Validate source and production build
    uses: ./.github/workflows/validate.yml
    with:
      run_command: |
        pnpm validate:types
        pnpm validate:dist
        pnpm test:all
        pnpm build
      needs_postgres: true
