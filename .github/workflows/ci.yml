name: Validate Source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-source-and-build:
    name: Validate source and production build
    runs-on: ubuntu-latest
    steps:
      - name: Get latest commit message
        id: commit-message
        run: |
          commit_msg=$(git log -1 --pretty=%B)
          echo "message=$commit_msg" >> $GITHUB_OUTPUT
      - name: Check if we should skip
        id: skip-check
        run: |
          if [[ "${{ steps.commit-message.outputs.message }}" == *"[skip ci]"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.commit-message.outputs.message }}" == *"Merge pull request"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
      - name: Skip job if skip ci
        if: steps.skip-check.outputs.skip == 'true'
        run: exit 0
      - name: Actually run the job
        if: steps.skip-check.outputs.skip == 'false'
        uses: actions/checkout@v5
      - name: Setup pnpm package manager
        if: steps.skip-check.outputs.skip == 'false'
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.2
      - name: Setup Node.js runtime
        if: steps.skip-check.outputs.skip == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm
      - name: Install dependencies
        if: steps.skip-check.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile --loglevel warn
      - name: Validate types
        if: steps.skip-check.outputs.skip == 'false'
        run: pnpm validate:types --loglevel warn
      - name: Validate dist
        if: steps.skip-check.outputs.skip == 'false'
        run: pnpm validate:dist --loglevel warn
      - name: Lint
        if: steps.skip-check.outputs.skip == 'false'
        run: pnpm lint --loglevel warn
      - name: Test
        if: steps.skip-check.outputs.skip == 'false'
        run: pnpm test:all --loglevel warn
      - name: Build production artifacts
        if: steps.skip-check.outputs.skip == 'false'
        run: pnpm build --loglevel warn
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Get latest commit message
        id: commit-message
        run: |
          commit_msg=$(git log -1 --pretty=%B)
          echo "message=$commit_msg" >> $GITHUB_OUTPUT
      - name: Check if we should skip
        id: skip-check
        run: |
          if [[ "${{ steps.commit-message.outputs.message }}" == *"[skip ci]"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
      - name: Skip job if skip ci
        if: steps.skip-check.outputs.skip == 'true'
        run: exit 0
      - name: Actually run the job
        if: steps.skip-check.outputs.skip == 'false'
        uses: actions/checkout@v5
      - name: Setup pnpm package manager
        if: steps.skip-check.outputs.skip == 'false'
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.2
      - name: Setup Node.js runtime
        if: steps.skip-check.outputs.skip == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm
      - name: Install dependencies
        if: steps.skip-check.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile --loglevel warn
      - name: Run docs check
        if: steps.skip-check.outputs.skip == 'false'
        run: pnpm docs:check --loglevel warn
