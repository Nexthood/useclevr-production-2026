name: Validate Source

on:
  push:
    branches: [main, beta]
    paths-ignore:
      - "docs/**"
      - ".TODO/**"
      - "*.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
  pull_request:
    branches: [main, beta]
    paths-ignore:
      - "docs/**"
      - ".TODO/**"
      - "*.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-and-build:
    name: Validate source and production build
    uses: ./.github/workflows/validate.yml
    with:
      run_command: |
        pnpm validate:types
        pnpm validate:dist
        pnpm lint:package
        pnpm test:all
        pnpm build
      needs_postgres: true

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm docs:check
