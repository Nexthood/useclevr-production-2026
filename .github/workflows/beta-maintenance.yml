name: Publish Dist-Test from Beta

on:
  push:
    branches: [beta]
    paths-ignore:
      - "docs/**"
      - ".TODO/**"
      - "*.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm publish to dist-test"
        required: true
        default: "no"

permissions:
  contents: write

env:
  AUTH_SECRET: ${{ format('{0}:{1}', github.sha, github.run_id) }}
  NO_COLOR: "1"
  FORCE_COLOR: "0"
  TERM: dumb

concurrency:
  group: beta-maintenance
  cancel-in-progress: true

jobs:
  publish-dist-test:
    name: Publish dist-test deployment folder
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Guard beta or dispatch only
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/beta" ]; then
            if [ "${{ inputs.confirm }}" != "yes" ]; then
              echo "Dist-test publish requires checkbox confirmation or beta branch push."
              exit 1
            fi
          fi

      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Enable corepack and install pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0+sha512.dbfcc4f81cf48597afd4bc391ffdf12c11f1a9fb83a395bfa6b0a2d9cc2fd8ffebafdb1ccbd529632153f793904c2615b7f09fe1a345473fd1c35845172a8eb1 --activate
          pnpm --version

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build production artifacts
        run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Smoke test generated server
        working-directory: dist
        run: |
          PORT=8090 node -r ./scripts/runtime/load-env.cjs ./scripts/runtime/start-dist.cjs > /tmp/useclevr-dist-smoke.log 2>&1 &
          pid=$!

          server_started=false
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8090/api/health >/dev/null 2>&1; then
              echo "Server is healthy!"
              server_started=true
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Server process exited prematurely."
              break
            fi
            echo "Waiting for server... (attempt $i/15)"
            sleep 2
          done

          kill "$pid" 2>/dev/null || true

          if [ "$server_started" = false ]; then
            echo "Smoke test failed. Server log:"
            cat /tmp/useclevr-dist-smoke.log
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Clean build output before publish
        run: |
          cd dist
          rm -f pnpm-workspace.yaml yarn.lock
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.packageManager; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"
          cd ..

          rm -f pnpm-workspace.yaml
          rm -rf dist/.next/cache
          rm -rf dist/.cache
          rm -rf dist/cache
          rm -rf dist/.turbo
          rm -rf dist/.vercel

      - name: Stage generated output
        run: |
          mv dist /tmp/useclevr-dist-output
          cp -a dist-root/. /tmp/useclevr-dist-root

      - name: Prepare dist-test commit title from PR
        id: dist-title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const shortSha = context.sha.slice(0, 7);
            let prTitle = `beta-${shortSha}`;

            if (context.payload.head_commit?.message) {
              prTitle = context.payload.head_commit.message.split('\n')[0]?.trim() || prTitle;
            }

            prTitle = prTitle.replace(/^PR-\d+:\s*/i, '');
            prTitle = prTitle.replace(/^PR:\s*/i, '');
            prTitle = prTitle.replace(/\s+/g, ' ').slice(0, 70).trim();
            prTitle = `Beta: ${prTitle}`;

            core.setOutput('title', prTitle);

      - name: Publish generated folder to clean dist-test branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          previous_dist_parent=""
          if git fetch --depth=1 origin dist-test:dist-test 2>/dev/null && git rev-parse --verify dist-test >/dev/null 2>&1; then
            previous_tree="$(git rev-parse dist-test^{tree})"
            previous_title="$(git log -1 --format=%s dist-test)"
            previous_dist_parent="$(git commit-tree "$previous_tree" -m "$previous_title")"
          fi

          git checkout --orphan new-dist-test
          git rm -rf . || true
          rm -rf .next
          rm -rf .cache
          rm -rf cache
          rm -rf .turbo
          rm -rf .vercel
          rm -f railpack.json

          mkdir -p dist
          rm -f dist/railpack.json
          cp -a /tmp/useclevr-dist-output/. dist/

          rm -rf dist/.next/cache
          rm -rf dist/.cache
          rm -rf dist/cache
          rm -rf dist/.turbo
          rm -rf dist/.vercel

          if [ -d "/tmp/useclevr-dist-root" ]; then
            cp -a /tmp/useclevr-dist-root/. .
          fi

          rm -f pnpm-workspace.yaml

          if [ ! -f "server-config/railway.json" ]; then
            echo "Error: server-config/railway.json is missing from dist-root."
            exit 1
          fi

          if [ ! -f "server-config/vercel.json" ]; then
            echo "Error: server-config/vercel.json is missing from dist-root."
            exit 1
          fi

          if [ ! -f ".gitignore" ]; then
            printf '%s\n' \
              ".env" \
              ".env.*" \
              "node_modules" \
              ".next/cache" \
              ".cache" \
              "cache" \
              ".turbo" \
              ".vercel" \
              "*.log" \
              > .gitignore
          fi

          if [ ! -f "README.md" ]; then
            printf '%s\n' \
              "# Generated deployment branch (test)" \
              "" \
              'This branch is generated automatically from `beta` by GitHub Actions.' \
              "" \
              "Do not edit this branch manually." \
              "Do not open pull requests from this branch into \`beta\`." \
              "Do not merge this branch into \`main\`." \
              "" \
              'Railway deploys from the `/dist` folder in this branch.' \
              'Railway config is stored at `/server-config/railway.json`.' \
              'Source code lives in `beta` or `main`.' \
              > README.md
          fi

          if [ -f "railway.json" ]; then
            echo "Error: railway.json must stay in server-config, not the dist branch root."
            exit 1
          fi

          if [ -f "vercel.json" ]; then
            echo "Error: vercel.json must stay in server-config, not the dist branch root."
            exit 1
          fi

          if [ -f "dist/railway.json" ] || [ -f "dist/vercel.json" ]; then
            echo "Error: host config files must not be published inside dist/."
            exit 1
          fi

          if [ -f "dist/yarn.lock" ]; then
            echo "Error: generated dist-test output must not publish yarn lockfiles."
            exit 1
          fi

          node -e "JSON.parse(require('fs').readFileSync('server-config/railway.json', 'utf8')); JSON.parse(require('fs').readFileSync('server-config/vercel.json', 'utf8'))"

          large_dist_file="$(find dist -type f -size +200M -print -quit)"
          if [ -n "$large_dist_file" ]; then
            echo "Error: files larger than GitHub limit still exist."
            exit 1
          fi

          # Remove source node_modules (from pnpm install) — untracked and preserved by
          # orphan checkout; would otherwise be staged by git add -A
          rm -rf node_modules
          # Remove source .pnpm-store (pnpm package cache) if present
          rm -rf .pnpm-store 2>/dev/null || true

          git add -A
          tree_sha="$(git write-tree)"
          if [ -n "$previous_dist_parent" ]; then
            commit_sha="$(git commit-tree "$tree_sha" -p "$previous_dist_parent" -m "${{ steps.dist-title.outputs.title }}")"
          else
            commit_sha="$(git commit-tree "$tree_sha" -m "${{ steps.dist-title.outputs.title }}")"
          fi
          git update-ref refs/heads/new-dist-test "$commit_sha"
          git push origin new-dist-test:dist-test --force

  ensure-beta-pr:
    name: Ensure beta to main pull request
    needs: publish-dist-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write

    steps:
      - name: Guard beta or dispatch only
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/beta" ]; then
            if [ "${{ inputs.confirm }}" != "yes" ]; then
              echo "Beta PR automation requires a beta branch push or a confirmed dispatch."
              exit 1
            fi
          fi

      - name: Checkout beta history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create or update the exact beta to main pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          beta_subject="$(git log -1 --format=%s beta)"
          clean_subject="$(printf '%s' "$beta_subject" | sed -E 's/^PR-[0-9]+:[[:space:]]*//; s/^PR:[[:space:]]*//' | tr '\n' ' ' | sed 's/[[:space:]]*$//' | cut -c1-70)"

          pr_number="$(gh pr list --repo "$REPO" --base main --head beta --state open \
            --json number,headRefName,baseRefName \
            --jq '[.[] | select(.headRefName == "beta" and .baseRefName == "main") | .number] | first // empty')"

          body_file="$(mktemp)"
          {
            echo "Automated release PR from \`beta\` to \`main\`, published to the dist-test environment after a successful build."
            echo ""
            echo "Head: beta @ $(git rev-parse --short beta)"
            echo ""
            echo "### Commits included"
            echo ""
            git log --format='- %s' origin/main..beta | grep -v -E '^Merge (branch|pull request)' || true
          } > "$body_file"

          if [ -n "$pr_number" ]; then
            echo "Refreshing existing beta -> main PR #$pr_number"
            gh pr edit "$pr_number" --repo "$REPO" --body-file "$body_file"
          else
            echo "Creating beta -> main PR"
            gh pr create --repo "$REPO" --base main --head beta \
              --title "$clean_subject" --body-file "$body_file" > /dev/null
            pr_number="$(gh pr list --repo "$REPO" --base main --head beta --state open \
              --json number,headRefName,baseRefName \
              --jq '[.[] | select(.headRefName == "beta" and .baseRefName == "main") | .number] | first // empty')"
            echo "Created PR #$pr_number"
          fi

          if [ -z "$pr_number" ]; then
            echo "Unable to resolve the beta -> main pull request number."
            exit 1
          fi

          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"

      - name: Enable GitHub native auto-merge when available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --merge 2>/dev/null; then
            echo "Native auto-merge enabled for PR #$PR_NUMBER."
          else
            echo "Native auto-merge unavailable; the wait-and-merge step below handles the merge."
          fi

      - name: Wait for required checks, merge, and dispatch production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for required checks on PR #$PR_NUMBER..."
          for i in {1..60}; do
            state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,merged --jq '{state, merged}' 2>/dev/null || echo '{"state":"OPEN","merged":false}')
            merged=$(echo "$state" | jq -r '.merged // false')
            pr_state=$(echo "$state" | jq -r '.state // "OPEN"')

            if [ "$merged" = "true" ]; then
              echo "PR already merged. Dispatching production build..."
              gh workflow run branch-maintenance.yml --ref main --repo "$REPO"
              exit 0
            fi

            if [ "$pr_state" = "CLOSED" ]; then
              echo "PR closed without merge. Exiting."
              exit 0
            fi

            mergeState=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null || echo "UNKNOWN")

            case "$mergeState" in
              CLEAN|UNSTABLE|HAS_HOOKS)
                echo "Checks passed (status: $mergeState). Merging PR..."
                if gh pr merge "$PR_NUMBER" --repo "$REPO" --merge; then
                  echo "PR merged! Dispatching production build..."
                  gh workflow run branch-maintenance.yml --ref main --repo "$REPO"
                  exit 0
                fi
                echo "Merge command failed, retrying..."
                ;;
            esac

            echo "Status: $mergeState (attempt $i/60)"
            sleep 20
          done
          echo "Timeout: required checks did not pass within 20 minutes"
          exit 1
