name: Sync Beta And Publish Dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-beta:
    name: Sync beta with main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Merge main into beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git push origin beta

  publish-dist:
    name: Publish dist deployment folder
    needs: sync-beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main source for build
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - name: Setup Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifacts
        run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Clean build output before publish
        run: |
          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache
          echo "Large files in source dist:"
          find dist -type f -size +45M -print || true

      - name: Stage generated output
        run: mv dist /tmp/useclevr-dist-output

      - name: Prepare dist commit title from PR
        id: dist-title
        uses: actions/github-script@v8
        with:
          script: |
            const shortSha = context.sha.slice(0, 7);
            let prNumber = null;
            let title = context.payload.head_commit?.message?.split('\n')[0]?.trim() || `Update dist ${shortSha}`;

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (prs.data.length > 0) {
              prNumber = prs.data[0].number;
              title = prs.data[0].title?.trim() || title;
            }

            title = title.replace(/^PR-\d+:\s*/i, '');
            title = title.replace(/^PR:\s*/i, '');
            title = title.replace(/\s+/g, ' ').slice(0, 70).trim();

            if (prNumber) {
              title = `PR-${prNumber}: ${title}`;
            } else {
              title = `Main: ${title}`;
            }

            core.setOutput('title', title);

      - name: Publish generated folder to clean dist branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan new-dist
          git rm -rf . || true

          mkdir -p dist
          cp -a /tmp/useclevr-dist-output/. dist/

          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache

          if [ -d "/tmp/useclevr-dist-output/../dist-root" ]; then
            cp /tmp/useclevr-dist-output/../dist-root/.gitignore . 2>/dev/null || true
            cp /tmp/useclevr-dist-output/../dist-root/README.md . 2>/dev/null || true
          elif [ -d "dist-root" ]; then
            cp dist-root/.gitignore . 2>/dev/null || true
            cp dist-root/README.md . 2>/dev/null || true
          fi

          if [ ! -f ".gitignore" ]; then
            cat > .gitignore <<'EOF'
          .env
          .env.*
          node_modules
          .next/cache
          .cache
          cache
          *.log
          EOF
          fi

          if [ ! -f "README.md" ]; then
            cat > README.md <<'EOF'
          # Generated deployment branch

          This branch is generated automatically from `main` by GitHub Actions.

          Do not edit this branch manually.
          Do not open pull requests from this branch into `main`.
          Do not merge this branch into `main`.

          Railway deploys from the `/dist` folder in this branch.
          Source code lives in `main`.
          EOF
          fi

          rm -f railway.json

          cd dist
          pnpm install --lockfile-only
          cp pnpm-lock.yaml ..
          cd ..

          echo "Large files remaining:"
          find . -type f -size +45M -print || true

          if find . -type f -size +95M | grep .; then
            echo "Error: files larger than GitHub limit still exist."
            exit 1
          fi

          git add -A
          git commit -m "${{ steps.dist-title.outputs.title }}"
          git push origin new-dist:dist --force
