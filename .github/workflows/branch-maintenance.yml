name: Sync Beta And Publish Dist

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"
  TERM: dumb

concurrency:
  group: branch-maintenance
  cancel-in-progress: true

jobs:
  sync-beta:
    name: Sync beta with main
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout beta
        uses: actions/checkout@v6
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge main into beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main beta
          git merge origin/main --no-edit -m "chore: sync main into beta [skip ci]" || git pull origin main --strategy=recursive --strategy-option=theirs
          git push origin HEAD:beta

  publish-dist:
    name: Publish dist deployment folder
    runs-on: ubuntu-latest

    steps:
      - name: Guard main branch only
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Dist publish is only allowed from main."
            exit 1
          fi

      - name: Checkout main source for build
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0+sha512.dbfcc4f81cf48597afd4bc391ffdf12c11f1a9fb83a395bfa6b0a2d9cc2fd8ffebafdb1ccbd529632153f793904c2615b7f09fe1a345473fd1c35845172a8eb1 --activate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --no-optional
          pnpm dedupe --no-optional

      - name: Build production artifacts
        run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Smoke test generated server
        working-directory: dist
        run: |
          PORT=8090 node -r ./scripts/runtime/load-env.cjs ./scripts/runtime/start-dist.cjs > /tmp/useclevr-dist-smoke.log 2>&1 &
          pid=$!

          sleep 5

          curl -fsS http://127.0.0.1:8090/api/health
          kill "$pid" >/dev/null 2>&1 || true

      - name: Clean build output before publish
        run: |
          cd dist
          pnpm install --lockfile-only --no-optional
          rm -f pnpm-workspace.yaml
          cd ..

          rm -f pnpm-workspace.yaml
          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache
          rm -rf dist/.turbo
          rm -rf dist/.vercel

      - name: Stage generated output
        run: |
          mv dist /tmp/useclevr-dist-output
          cp -a dist-root /tmp/useclevr-dist-root

      - name: Prepare dist commit title from PR
        id: dist-title
        uses: actions/github-script@v9
        with:
          script: |
            const shortSha = context.sha.slice(0, 7);
            const msg = context.payload.head_commit?.message || "";
            let title = msg.split('\n')[0]?.trim() || `Update dist ${shortSha}`;
            title = title.replace(/\s+/g, ' ').slice(0, 70).trim();
            core.setOutput('title', `Main: ${title}`);

      - name: Publish generated folder to clean dist branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan new-dist
          git rm -rf . || true

          mkdir -p dist
          cp -a /tmp/useclevr-dist-output/. dist/

          if [ -d "/tmp/useclevr-dist-root" ]; then
            cp -a /tmp/useclevr-dist-root/. .
          fi

          rm -f pnpm-workspace.yaml

          git add -A
          git commit -m "${{ steps.dist-title.outputs.title }}"
          git push origin new-dist:dist --force
