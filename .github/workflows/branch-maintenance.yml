name: Sync Beta And Publish Dist

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"
  TERM: dumb

concurrency:
  group: branch-maintenance
  cancel-in-progress: true

jobs:
  sync-beta:
    name: Sync beta with main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Merge main into beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -m "chore: sync main into beta [skip ci]" || git pull origin main --strategy=recursive --strategy-option=theirs
          git push origin beta

  publish-dist:
    name: Publish dist deployment folder
    runs-on: ubuntu-latest

    steps:
      - name: Guard main branch only
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Dist publish is only allowed from main."
            exit 1
          fi

      - name: Checkout main source for build
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --no-optional
          pnpm dedupe --no-optional

      - name: Validate source before publishing
        run: |
          pnpm validate:types
          pnpm validate:dist
          pnpm lint

      - name: Build production artifacts
        run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Smoke test generated server
        run: |
          PORT=8090 npm --prefix dist run start > /tmp/useclevr-dist-smoke.log 2>&1 &
          pid=$!

          sleep 5

          curl -fsS http://127.0.0.1:8090/api/health
          kill "$pid" >/dev/null 2>&1 || true

      - name: Clean build output before publish
        run: |
          cd dist
          pnpm install --lockfile-only --no-optional
          rm -f pnpm-workspace.yaml
          cd ..

          rm -f pnpm-workspace.yaml
          rm -f dist/pnpm-workspace.yaml
          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/node_modules/.pnpm/@next+swc-*
          rm -rf dist/node_modules/@next/swc-*
          rm -rf dist/.cache
          rm -rf dist/cache
          rm -rf dist/.turbo
          rm -rf dist/.vercel
          rm -rf dist/.next/cache/webpack
          large_source_file="$(find dist -type f -size +95M -print -quit)"
          if [ -n "$large_source_file" ]; then
            echo "Error: generated dist contains a file larger than GitHub limit."
            exit 1
          fi

      - name: Stage generated output
        run: |
          mv dist /tmp/useclevr-dist-output
          cp -a dist-root /tmp/useclevr-dist-root

      - name: Prepare dist commit title from PR
        id: dist-title
        uses: actions/github-script@v8
        with:
          script: |
            const shortSha = context.sha.slice(0, 7);
            let prNumber = null;
            let title =
              context.payload.head_commit?.message?.split('\n')[0]?.trim() ||
              `Update dist ${shortSha}`;

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (prs.data.length > 0) {
              prNumber = prs.data[0].number;
              title = prs.data[0].title?.trim() || title;
            }

            title = title.replace(/^PR-\d+:\s*/i, '');
            title = title.replace(/^PR:\s*/i, '');
            title = title.replace(/\s+/g, ' ').slice(0, 70).trim();

            if (prNumber) {
              title = `PR-${prNumber}: ${title}`;
            } else {
              title = `Main: ${title}`;
            }

            core.setOutput('title', title);

      - name: Publish generated folder to clean dist branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          previous_dist_parent=""
          if git fetch --depth=1 origin dist:dist 2>/dev/null && git rev-parse --verify dist >/dev/null 2>&1; then
            previous_tree="$(git rev-parse dist^{tree})"
            previous_title="$(git log -1 --format=%s dist)"
            previous_dist_parent="$(git commit-tree "$previous_tree" -m "$previous_title")"
          fi

          git checkout --orphan new-dist
          git rm -rf . || true
          rm -rf .next
          rm -rf node_modules
          rm -rf .cache
          rm -rf cache
          rm -rf .turbo
          rm -rf .vercel

          mkdir -p dist
          cp -a /tmp/useclevr-dist-output/. dist/

          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache
          rm -rf dist/.turbo
          rm -rf dist/.vercel

          if [ -d "/tmp/useclevr-dist-root" ]; then
            cp -a /tmp/useclevr-dist-root/. .
          fi

          rm -f pnpm-workspace.yaml
          rm -f dist/pnpm-workspace.yaml

          if [ ! -f "server-config/railway.json" ]; then
            echo "Error: server-config/railway.json is missing from dist-root."
            exit 1
          fi

          if [ ! -f "server-config/vercel.json" ]; then
            echo "Error: server-config/vercel.json is missing from dist-root."
            exit 1
          fi

          if [ ! -f ".gitignore" ]; then
            cat > .gitignore <<'EOF'
          .env
          .env.*
          node_modules
          .next/cache
          .cache
          cache
          .turbo
          .vercel
          *.log
          EOF
          fi

          if [ ! -f "README.md" ]; then
            cat > README.md <<'EOF'
          # Generated deployment branch

          This branch is generated automatically from `main` by GitHub Actions.

          Do not edit this branch manually.
          Do not open pull requests from this branch into `main`.
          Do not merge this branch into `main`.

          Railway deploys from the `/dist` folder in this branch.
          Railway config is stored at `/server-config/railway.json`.
          Source code lives in `main`.
          EOF
          fi

          if [ -f "railway.json" ]; then
            echo "Error: railway.json must stay in server-config, not the dist branch root."
            exit 1
          fi

          if [ -f "vercel.json" ]; then
            echo "Error: vercel.json must stay in server-config, not the dist branch root."
            exit 1
          fi

          if [ -f "dist/railway.json" ] || [ -f "dist/vercel.json" ]; then
            echo "Error: host config files must not be published inside dist/."
            exit 1
          fi

          node -e "JSON.parse(require('fs').readFileSync('server-config/railway.json', 'utf8')); JSON.parse(require('fs').readFileSync('server-config/vercel.json', 'utf8'))"

          large_dist_file="$(find dist -type f -size +95M -print -quit)"
          if [ -n "$large_dist_file" ]; then
            echo "Error: files larger than GitHub limit still exist."
            exit 1
          fi

          git add -A
          if git ls-files -s | awk '{print $4}' | while read -r file; do
            if [ -f "$file" ] && [ "$(wc -c < "$file")" -gt 99614720 ]; then
              printf '%s\n' "$file"
            fi
          done | grep .; then
            echo "Error: staged files larger than GitHub limit still exist."
            exit 1
          fi

          tree_sha="$(git write-tree)"
          if [ -n "$previous_dist_parent" ]; then
            commit_sha="$(git commit-tree "$tree_sha" -p "$previous_dist_parent" -m "${{ steps.dist-title.outputs.title }}")"
          else
            commit_sha="$(git commit-tree "$tree_sha" -m "${{ steps.dist-title.outputs.title }}")"
          fi
          git update-ref refs/heads/new-dist "$commit_sha"
          git push origin new-dist:dist --force