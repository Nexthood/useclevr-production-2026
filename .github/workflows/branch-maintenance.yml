name: Sync Beta And Publish Dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-beta:
    name: Sync beta with main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Merge main into beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git push origin beta

  publish-dist:
    name: Publish dist deployment folder
    needs: sync-beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main source for build
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm package manager
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - name: Setup Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifacts
        run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Clean build output before publish
        run: |
          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache
          echo "Large files in source dist:"
          find dist -type f -size +45M -print || true

      - name: Stage generated output
        run: mv dist /tmp/useclevr-dist-output

      - name: Checkout dist branch for deployment
        uses: actions/checkout@v5
        with:
          ref: dist
          path: dist-branch
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Prepare dist commit title from PR
        id: dist-title
        uses: actions/github-script@v8
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const prTitle = prs.data[0]?.title?.trim();
            const shortSha = context.sha.slice(0, 7);
            let title = prTitle || context.payload.head_commit?.message?.split('\n')[0]?.trim() || `Update dist ${shortSha}`;

            title = title.replace(/\s+/g, ' ').slice(0, 80).trim();
            if (!title.startsWith('PR:')) {
              title = `PR: ${title}`;
            }

            core.setOutput('title', title);

      - name: Publish generated folder to dist branch
        run: |
          rm -rf dist-branch/.next
          rm -rf dist-branch/next-env.d.ts
          rm -rf dist-branch/dist
          mkdir -p dist-branch/dist
          cp -a /tmp/useclevr-dist-output/. dist-branch/dist/

          rm -rf dist-branch/dist/.next/cache
          rm -rf dist-branch/dist/node_modules
          rm -rf dist-branch/dist/.cache
          rm -rf dist-branch/dist/cache

          # Remove any existing railway.json at the root of the dist branch (we only want it inside the generated dist folder)
          rm -f dist-branch/railway.json

# Copy dist-root files (version-controlled root configs)
           if [ -d "dist-root" ]; then
             cp dist-root/.gitignore dist-branch/
             cp dist-root/README.md dist-branch/
           fi

           # Generate matching lockfile for dist/package.json
           cd dist-branch/dist
           pnpm install --lockfile-only
           cp pnpm-lock.yaml ../
           cd ..

           echo "Large files remaining:"
          find . -type f -size +45M -print || true

          if find . -type f -size +95M | grep .; then
            echo "Error: files larger than GitHub limit still exist."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No dist changes to publish."
          else
            git commit -m "${{ steps.dist-title.outputs.title }}"
            git push origin HEAD:dist
          fi
