name: Sync Beta And Publish Dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-beta:
    name: Sync beta with main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Merge main into beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git push origin beta

  publish-dist:
    name: Publish dist deployment folder
    needs: sync-beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main source
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Clean build output before publish
        run: |
          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache
          echo "Large files in source dist:"
          find dist -type f -size +45M -print || true

      - name: Stage generated output
        run: |
          mv dist /tmp/useclevr-dist-output

      - name: Checkout dist branch
        uses: actions/checkout@v5
        with:
          ref: dist
          path: dist-branch
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Publish generated folder to dist branch
        run: |
          rm -rf dist-branch/dist
          mkdir -p dist-branch/dist
          cp -a /tmp/useclevr-dist-output/. dist-branch/dist/

          rm -rf dist-branch/dist/.next/cache
          rm -rf dist-branch/dist/node_modules
          rm -rf dist-branch/dist/.cache
          rm -rf dist-branch/dist/cache

          cat > dist-branch/.gitignore <<'EOF'
          .env
          .env.*
          node_modules/
          .next/cache/
          .cache/
          cache/
          *.log
          EOF

          if [ ! -f dist-branch/README.md ]; then
          cat > dist-branch/README.md <<'EOF'
          # Generated deployment branch

          This branch is generated automatically from `main` by GitHub Actions.

          Do not edit this branch manually.
          Do not open pull requests from this branch into `main`.
          Do not merge this branch into `main`.

          Railway deploys from the `/dist` folder in this branch.
          Source code lives in `main`.
          EOF
          fi

          cd dist-branch
          echo "Large files remaining:"
          find . -type f -size +45M -print || true

          if find . -type f -size +95M | grep .; then
            echo "Error: files larger than GitHub limit still exist."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No dist changes to publish."
          else
            git commit -m "Deploy dist from main commit ${{ github.sha }}"
            git push origin HEAD:dist
          fi
