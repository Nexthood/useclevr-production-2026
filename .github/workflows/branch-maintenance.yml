name: Publish Dist And Sync Beta

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-dist:
    name: Publish dist deployment branch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Clean build output before publish
        run: |
          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache
          echo "Large files in source dist:"
          find dist -type f -size +45M -print || true

      - name: Publish to dist branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mv dist build-output

          git checkout --orphan new-dist HEAD
          git rm -rf . || true

          mkdir -p dist
          cp -a build-output/. dist/

          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache

          cat > .gitignore <<'EOF'
          .env
          .env.*
          node_modules
          .next/cache
          .cache
          cache
          *.log
          EOF

          cat > README.md <<'EOF'
          # Generated deployment branch

          This branch is generated automatically from `main` by GitHub Actions.

          Do not edit this branch manually.
          Do not open pull requests from this branch into `main`.
          Do not merge this branch into `main`.

          Railway deploys from the `/dist` folder in this branch.
          Source code lives in `main`.
          EOF

          echo "Large files remaining:"
          find . -type f -size +45M -print || true

          if find . -type f -size +95M | grep .; then
            echo "Error: files larger than GitHub limit still exist."
            exit 1
          fi

          git add -A
          git commit -m "Deploy from main commit ${{ github.sha }}"
          git push origin new-dist:dist --force

  sync-beta:
    name: Sync beta with main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Merge main into beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git push origin beta
