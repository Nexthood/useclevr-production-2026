name: Sync Beta And Publish Dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-beta:
    name: Sync beta with main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Merge main into beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git push origin beta

  publish-dist:
    name: Publish dist deployment folder
    needs: sync-beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main source
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Clean build output before publish
        run: |
          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache
          echo "Large files in source dist:"
          find dist -type f -size +45M -print || true

      - name: Stage generated output
        run: |
          mv dist /tmp/useclevr-dist-output

      - name: Checkout dist branch
        uses: actions/checkout@v5
        with:
          ref: dist
          path: dist-branch
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Publish generated folder to dist branch
        run: |
          rm -rf dist-branch/.next
          rm -rf dist-branch/next-env.d.ts
          rm -rf dist-branch/dist
          mkdir -p dist-branch/dist
          cp -a /tmp/useclevr-dist-output/. dist-branch/dist/

          rm -rf dist-branch/dist/.next/cache
          rm -rf dist-branch/dist/node_modules
          rm -rf dist-branch/dist/.cache
          rm -rf dist-branch/dist/cache

          # Copy dist-root files (version-controlled root configs)
          if [ -d "dist-root" ]; then
            cp dist-root/.gitignore dist-branch/
            cp dist-root/README.md dist-branch/
          fi

          # Copy railway.json into the generated dist folder so it ends up inside dist-branch/dist/
          if [ -f "dist-root/railway.json" ]; then
            cp dist-root/railway.json dist/
          fi

          cd dist-branch
          echo "Large files remaining:"
          find . -type f -size +45M -print || true

          if find . -type f -size +95M | grep .; then
            echo "Error: files larger than GitHub limit still exist."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No dist changes to publish."
          else
            git commit -m "Deploy dist from main commit ${{ github.sha }}"
            git push origin HEAD:dist
          fi
