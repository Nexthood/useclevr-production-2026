name: Sync Beta And Publish Dist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"
  TERM: dumb

concurrency:
  group: branch-maintenance
  cancel-in-progress: true

jobs:
  sync-beta:
    name: Sync beta with main
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout beta
        uses: actions/checkout@v6
        with:
          ref: beta
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge main into beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main beta
          git merge origin/main --no-edit -m "chore: sync main into beta [skip ci]" || git pull origin main --strategy=recursive --strategy-option=theirs
          git push origin HEAD:beta

  publish-dist:
    name: Publish dist deployment folder
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Guard main branch only
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Dist publish is only allowed from main."
            exit 1
          fi

      - name: Checkout main source for build
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Enable corepack and install pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0+sha512.dbfcc4f81cf48597afd4bc391ffdf12c11f1a9fb83a395bfa6b0a2d9cc2fd8ffebafdb1ccbd529632153f793904c2615b7f09fe1a345473fd1c35845172a8eb1 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build production artifacts
        run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Smoke test generated server
        working-directory: dist
        run: |
          PORT=8090 node -r ./scripts/runtime/load-env.cjs ./scripts/runtime/start-dist.cjs > /tmp/useclevr-dist-smoke.log 2>&1 &
          pid=$!

          # Wait for server to be ready with retries
          server_started=false
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8090/api/health >/dev/null 2>&1; then
              echo "Server is healthy!"
              server_started=true
              break
            fi
            echo "Waiting for server to start... (attempt $i/15)"
            sleep 2
          done

          kill "$pid" >/dev/null 2>&1 || true

          if [ "$server_started" = false ]; then
            echo "Server failed to start. Smoke test output:"
            cat /tmp/useclevr-dist-smoke.log
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Clean build output before publish
        run: |
          cd dist
          rm -f pnpm-workspace.yaml pnpm-lock.yaml yarn.lock
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.packageManager; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"
          cd ..

          rm -f pnpm-workspace.yaml
          rm -rf dist/.next/cache
          rm -rf dist/.cache
          rm -rf dist/cache
          rm -rf dist/.turbo
          rm -rf dist/.vercel

          # Remove large .node binaries (e.g. Next.js SWC fallback >100MB) that exceed GitHub limit
          find dist/node_modules -name "*.node" -size +50M -delete 2>/dev/null || true

      - name: Stage generated output
        run: |
          mv dist /tmp/useclevr-dist-output
          cp -a dist-root /tmp/useclevr-dist-root

      - name: Prepare dist commit title from PR
        id: dist-title
        uses: actions/github-script@v9
        with:
          script: |
            const shortSha = context.sha.slice(0, 7);
            const msg = context.payload.head_commit?.message || "";
            let title = msg.split('\n')[0]?.trim() || `Update dist ${shortSha}`;
            title = title.replace(/\s+/g, ' ').slice(0, 70).trim();
            core.setOutput('title', `Main: ${title}`);

      - name: Publish generated folder to clean dist branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan new-dist
          git rm -rf . || true

          mkdir -p dist
          cp -a /tmp/useclevr-dist-output/. dist/

          if [ -d "/tmp/useclevr-dist-root" ]; then
            cp -a /tmp/useclevr-dist-root/. .
          fi

          rm -f pnpm-workspace.yaml

          git add -A
          git commit -m "${{ steps.dist-title.outputs.title }}"
          git push origin new-dist:dist --force
