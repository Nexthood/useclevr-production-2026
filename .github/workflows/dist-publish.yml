name: Publish Dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Remove large/cache files from dist
        run: |
          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache
          echo "Large files remaining in dist:"
          find dist -type f -size +90M -print || true

      - name: Fail if dist still contains huge files
        run: |
          if find dist -type f -size +95M | grep .; then
            echo "Error: dist still contains files larger than 95MB."
            exit 1
          fi

      - name: Publish to dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan new-dist HEAD
          git rm -rf . || true

          # Copy dist contents, including hidden files/folders like .next
          cp -a dist/. ./

          git add -A
          git commit -m "Deploy from main commit ${{ github.sha }}"
          git push origin new-dist:dist --force
