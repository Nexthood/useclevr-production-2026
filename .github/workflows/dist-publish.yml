name: Publish Dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2

      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prod:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Clean dist before publish
        run: |
          rm -rf dist/.next/cache
          rm -rf dist/node_modules
          rm -rf dist/.cache
          rm -rf dist/cache
          echo "Large files in dist:"
          find dist -type f -size +45M -print || true

      - name: Publish to dist branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan new-dist HEAD
          git rm -rf . || true

          cp -a dist/. ./

          rm -rf .next/cache
          rm -rf node_modules
          rm -rf .cache
          rm -rf cache

          echo "Large files remaining:"
          find . -type f -size +45M -print || true

          if find . -type f -size +95M | grep .; then
            echo "Error: files larger than GitHub limit still exist."
            exit 1
          fi

          git add -A
          git commit -m "Deploy from main commit ${{ github.sha }}"
          git push origin new-dist:dist --force
