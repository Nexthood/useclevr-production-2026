name: Auto-merge PRs from beta to main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge PR from beta to main
    if: >
      github.event.pull_request.head.ref == 'beta' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Format PR title with PR number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^PR-[0-9]+: ]]; then
            NEW_TITLE="PR-$PR_NUMBER: $PR_TITLE"
            gh pr edit "$PR_NUMBER" --title "$NEW_TITLE" --repo "${{ github.repository }}"
          fi

      - name: Wait for checks, merge, and dispatch production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Waiting for required checks to pass..."
          for i in {1..40}; do
            state=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json state,merged --jq '{state, merged}' 2>/dev/null || echo '{"state":"OPEN","merged":false}')
            merged=$(echo "$state" | jq -r '.merged // false')
            pr_state=$(echo "$state" | jq -r '.state // "OPEN"')

            if [ "$merged" = "true" ]; then
              echo "PR already merged. Dispatching production build..."
              gh workflow run branch-maintenance.yml --ref main
              exit 0
            fi

            if [ "$pr_state" = "CLOSED" ]; then
              echo "PR closed without merge. Exiting."
              exit 0
            fi

            mergeState=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null || echo "UNKNOWN")

            case "$mergeState" in
              CLEAN|UNSTABLE|HAS_HOOKS)
                echo "Checks passed (status: $mergeState). Merging PR..."
                if gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --merge; then
                  echo "PR merged! Dispatching production build..."
                  gh workflow run branch-maintenance.yml --ref main --repo "${{ github.repository }}"
                  exit 0
                fi
                echo "Merge command failed, retrying..."
                ;;
            esac

            echo "Status: $mergeState (attempt $i/40)"
            sleep 15
          done
          echo "Timeout: checks did not pass within 10 minutes"
          exit 1